name: Release Notifly

# Push a tag that matches the version in manifest.json (for example 1.0.0).
# One draft release gets the plugin files Obsidian installs (main.js, manifest.json, styles.css)
# and the quick capture app for each system. Review the draft, then publish it.
on:
    push:
        tags:
            - '*'

jobs:
    plugin:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
            attestations: write
        steps:
            - uses: actions/checkout@v6

            - name: Use Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: 'npm'

            - name: Check the tag matches the plugin version
              run: |
                  tag="${GITHUB_REF#refs/tags/}"
                  version="$(node -p "require('./manifest.json').version")"
                  if [ "$tag" != "$version" ]; then
                    echo "Tag $tag does not match manifest.json version $version" >&2
                    exit 1
                  fi

            - name: Build plugin
              run: |
                  npm ci
                  npm run build
                  npm run lint

            - name: Attest build provenance
              uses: actions/attest@v4
              with:
                  subject-path: |
                      main.js
                      styles.css

            - name: Create draft release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag="${GITHUB_REF#refs/tags/}"
                  gh release create "$tag" \
                    --title="$tag" \
                    --draft \
                    main.js manifest.json styles.css

    quick-capture:
        needs: plugin
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-22.04
                      built: notifly-daemon
                      asset: notifly-daemon-linux-x86_64
                    - os: windows-latest
                      built: notifly-daemon.exe
                      asset: notifly-daemon-windows-x86_64.exe
                    - os: macos-latest
                      built: notifly-daemon
                      asset: notifly-daemon-macos-arm64
        runs-on: ${{ matrix.os }}
        permissions:
            contents: write
            id-token: write
            attestations: write
        defaults:
            run:
                shell: bash
        steps:
            - uses: actions/checkout@v6

            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: 'npm'

            - name: Build the capture window page
              run: npm ci && npm run build:popup

            - uses: dtolnay/rust-toolchain@stable

            - name: Linux system libraries
              if: runner.os == 'Linux'
              run: sudo apt-get update && sudo apt-get install -y libxdo-dev libxkbcommon-dev libwebkit2gtk-4.1-dev libgtk-3-dev

            - name: Test and build
              working-directory: daemon
              run: |
                  cargo test --release --locked
                  cargo build --release --locked

            - name: Name the file and write its checksum
              run: |
                  cp "daemon/target/release/${{ matrix.built }}" "${{ matrix.asset }}"
                  if command -v sha256sum >/dev/null; then sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"; else shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"; fi

            - name: Attest build provenance
              uses: actions/attest@v4
              with:
                  subject-path: ${{ matrix.asset }}

            - name: Add to the release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag="${GITHUB_REF#refs/tags/}"
                  gh release upload "$tag" "${{ matrix.asset }}" "${{ matrix.asset }}.sha256" --clobber
