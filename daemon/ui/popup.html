<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notifly</title>
<style>/* Shared by the Alt+C popup and the in-app capture modal. */
.nf-live .cm-editor { background: transparent; outline: none; }
.nf-live .cm-scroller { font-family: var(--font-text); font-size: var(--nf-size, 14px); line-height: 1.5; overflow-y: auto; padding: 4px 0 8px; }
.nf-live .cm-content { caret-color: var(--text-normal); padding: 0; }
.nf-live .cm-line { padding: 0 2px; }
.nf-live .cm-cursor { border-left: 1.5px solid var(--text-normal); }
.nf-live .cm-selectionBackground, .nf-live .cm-focused .cm-selectionBackground { background: color-mix(in srgb, var(--interactive-accent) 35%, transparent) !important; }
.nf-live .cm-placeholder { color: var(--text-faint); }
.nf-live .nf-h { font-weight: 700; line-height: 1.3; padding-top: .2em !important; }
.nf-live .nf-h1 { font-size: 1.35em; }
.nf-live .nf-h2 { font-size: 1.2em; }
.nf-live .nf-h3 { font-size: 1.1em; }
.nf-live .nf-h4 { font-size: 1.05em; }
.nf-live .nf-h5, .nf-live .nf-h6 { font-size: 1em; color: var(--text-muted); }
.nf-live .nf-strong { font-weight: 700; }
.nf-live .nf-em { font-style: italic; }
.nf-live .nf-strike { text-decoration: line-through; color: var(--text-muted); }
.nf-live .nf-code { font-family: var(--font-monospace); font-size: .88em; background: var(--code-background); border-radius: var(--radius-s); padding: 0 .3em; }
.nf-live .nf-fence { font-family: var(--font-monospace); font-size: .88em; background: var(--code-background); }
.nf-live .nf-quote { border-left: 2px solid var(--interactive-accent); padding-left: 10px !important; color: var(--text-muted); }
.nf-live .nf-bullet { color: var(--text-muted); display: inline-block; width: .9em; }
.nf-live .nf-listmark { color: var(--text-muted); }
.nf-live .nf-task { color: var(--text-accent); font-family: var(--font-monospace); }
.nf-live .nf-task-done { color: var(--text-faint); text-decoration: line-through; }
.nf-live .nf-check { display: inline-block; position: relative; width: 14px; height: 14px; margin: 0 8px 0 1px; vertical-align: -2px; border: 1.5px solid var(--text-faint); border-radius: 4px; cursor: pointer; transition: background-color 120ms, border-color 120ms; }
.nf-live .nf-check:hover { border-color: var(--text-muted); }
.nf-live .nf-check.is-done { background: var(--interactive-accent); border-color: var(--interactive-accent); }
.nf-live .nf-check.is-done::after { content: ""; position: absolute; left: 3.5px; top: .5px; width: 4px; height: 8px; border: solid var(--text-on-accent, #fff); border-width: 0 1.8px 1.8px 0; transform: rotate(45deg); }
.nf-live .nf-embed { color: var(--text-accent); background: var(--tag-background); border-radius: var(--radius-s); padding: .05em .5em; font-size: .9em; }
.nf-live .nf-embed::after { content: attr(data-kind); margin-left: 6px; padding: 0 5px; border-radius: 3px; background: var(--background-modifier-hover); color: var(--text-muted); font-size: .75em; }
.nf-live .nf-link, .nf-live .nf-wikilink { color: var(--text-accent); }
.nf-live .nf-link { text-decoration: underline; }
.nf-live .nf-tag { color: var(--tag-color); background: var(--tag-background); border-radius: 1em; padding: .05em .5em; font-size: .9em; }
.nf-live .nf-hr { color: var(--text-faint); }
.nf-raw.nf-live .cm-scroller { font-family: var(--font-monospace); font-size: calc(var(--nf-size, 14px) - 1px); }
.nf-raw.nf-live .nf-h { font-size: 1em; }
.nf-raw.nf-live .nf-code, .nf-raw.nf-live .nf-fence { background: transparent; padding: 0; }
.nf-raw.nf-live .nf-tag { background: transparent; padding: 0; border-radius: 0; }
.nf-live .nf-link[data-url] { cursor: pointer; }
.nf-live .nf-link[data-url]:hover { text-decoration-thickness: 2px; }
:root {
 --background-primary: #1e1e1e; --background-secondary: #262626; --background-modifier-border: #363636; --background-modifier-hover: rgba(255,255,255,.07);
 --text-normal: #dadada; --text-muted: #b3b3b3; --text-faint: #666; --text-accent: #a68af9; --interactive-accent: #7b6cd9; --interactive-accent-hover: #8a7ce0;
 --text-on-accent: #fff; --text-error: #fb464c; --code-background: #262626; --tag-color: #a68af9; --tag-background: rgba(166,138,249,.12);
 --font-text: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif; --font-interface: var(--font-text); --font-monospace: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
 --font-text-size: 16px; --radius-s: 4px; --radius-m: 8px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: transparent; color: var(--text-normal); font-family: var(--font-interface); font-size: 13px; overflow: hidden; -webkit-font-smoothing: antialiased; cursor: default; user-select: none; }
.frame { height: 100%; display: flex; flex-direction: column; background: var(--background-primary); border: 1px solid var(--background-modifier-border); border-radius: 12px; overflow: hidden; }
.bar { display: flex; align-items: center; gap: 8px; padding: 10px 14px 6px; flex: none; }
.heading { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
.title { font-weight: 600; color: var(--text-normal); white-space: nowrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 8px; border-radius: var(--radius-s); border-color: transparent; background: var(--background-secondary); }
.chip .glyph { color: var(--text-accent); }
.chip .caret { color: var(--text-faint); font-size: 10px; }
.sep { margin-left: 2px; }
.status { margin-left: auto; }
.picker { display: flex; flex-direction: column; gap: 6px; padding: 2px 14px 8px; flex: none; }
.picker[hidden] { display: none; }
.cat-find { width: 100%; height: 28px; padding: 0 10px; border-radius: var(--radius-s); border: 1px solid var(--background-modifier-border); background: var(--background-secondary); color: var(--text-normal); font: inherit; outline: none; user-select: text; }
.cat-find:focus { border-color: var(--interactive-accent); }
.cat-find::placeholder { color: var(--text-faint); }
.cat-pills { display: flex; flex-wrap: wrap; gap: 6px; max-height: 64px; overflow-y: auto; }
.cat-note { margin: 0; color: var(--text-faint); font-size: 11.5px; min-height: 1em; }
.tpl { display: inline-flex; align-items: center; gap: 6px; flex: none; height: 24px; padding: 0 9px; border-radius: 999px; }
.tpl .glyph { color: var(--text-accent); }
.tpl[data-active="true"] { border-color: var(--interactive-accent); }
.tpl.create { border-style: dashed; color: var(--text-muted); }
.tpl[aria-selected="true"] { background: var(--interactive-accent); color: var(--text-on-accent); border-color: transparent; }
.tpl[aria-selected="true"] .glyph { color: inherit; }
button.ghost { background: transparent; border-color: transparent; color: var(--text-muted); }
button.ghost[aria-pressed="true"] { color: var(--text-accent); background: var(--background-modifier-hover); }
.sep, .folder, .status { color: var(--text-faint); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.folder { color: var(--text-muted); }
.editor { flex: 1; min-height: 0; padding: 0 14px; user-select: text; cursor: text; }
.editor .cm-editor { height: 100%; }
.error { margin: 0; padding: 6px 14px; color: var(--text-error); font-size: 12px; flex: none; user-select: text; }
.actions { display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 8px 14px 12px; flex: none; border-top: 1px solid var(--background-modifier-border); }
.hint { margin-right: auto; color: var(--text-faint); font-size: 12px; }
kbd { font-family: var(--font-interface); font-size: 11px; padding: 1px 5px; border: 1px solid var(--background-modifier-border); border-radius: var(--radius-s); background: var(--background-secondary); color: var(--text-muted); }
button { font: inherit; height: 28px; padding: 0 14px; border-radius: var(--radius-s); border: 1px solid var(--background-modifier-border); background: var(--background-secondary); color: var(--text-normal); cursor: pointer; transition: background-color 120ms; }
button:hover:not(:disabled) { background: var(--background-modifier-hover); }
button:focus-visible { outline: 2px solid var(--interactive-accent); outline-offset: 1px; }
button.mod-cta { background: var(--interactive-accent); border-color: transparent; color: var(--text-on-accent); }
button.mod-cta:hover:not(:disabled) { background: var(--interactive-accent-hover); }
button:disabled { opacity: .5; cursor: not-allowed; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

.cm-tooltip.cm-tooltip-autocomplete { background: var(--background-secondary); border: 1px solid var(--background-modifier-border); border-radius: var(--radius-m); padding: 4px; box-shadow: 0 6px 20px rgba(0,0,0,.35); font-family: var(--font-interface); font-size: 13px; }
.cm-tooltip-autocomplete > ul { font-family: inherit; max-height: 180px; }
.cm-tooltip-autocomplete > ul > li { padding: 3px 8px; border-radius: var(--radius-s); color: var(--text-normal); }
.cm-tooltip-autocomplete > ul > li[aria-selected] { background: var(--interactive-accent); color: var(--text-on-accent); }
.glyph:empty::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--text-accent); vertical-align: middle; }
.tpl[aria-selected="true"] .glyph:empty::before { background: currentColor; }

button.icon { display: inline-flex; align-items: center; gap: 4px; width: auto; min-width: 28px; padding: 0 6px; background: transparent; border-color: transparent; color: var(--text-muted); }
button.icon svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
button.icon:hover:not(:disabled) { color: var(--text-normal); }
.rec-dot, .rec-time { display: none; }
button.icon.is-recording { color: var(--text-error); }
button.icon.is-recording .mic { display: none; }
button.icon.is-recording .rec-dot { display: inline-block; width: 9px; height: 9px; border-radius: 2px; background: currentColor; animation: nf-pulse 1.1s ease-in-out infinite; }
button.icon.is-recording .rec-time { display: inline; font-variant-numeric: tabular-nums; font-size: 12px; }
@keyframes nf-pulse { 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) { button.icon.is-recording .rec-dot { animation: none; } }
.editor.nf-dragging { outline: 2px dashed var(--interactive-accent); outline-offset: -4px; border-radius: 8px; }
.editor.nf-dragging::after { content: "Drop to add"; position: absolute; right: 22px; top: 52px; padding: 2px 8px; border-radius: 999px; background: var(--interactive-accent); color: var(--text-on-accent); font-size: 11px; pointer-events: none; }
.actions { gap: 4px; }
.hint { margin-left: 6px; }
</style>
</head>
<body>
<div class="frame">
 <header id="bar" class="bar">
  <button id="chip" class="chip" type="button" aria-haspopup="listbox" aria-expanded="false" title="Category (Tab or Alt)">
   <span id="glyph" class="glyph"></span><span id="title" class="title"></span><span class="caret">▾</span>
  </button>
  <span class="sep">in</span><span id="folder" class="folder"></span>
  <span id="status" class="status"></span>
 </header>
 <section id="picker" class="picker" aria-label="Categories" hidden>
  <input id="cat-find" class="cat-find" type="text" placeholder="Find or make a category…" autocomplete="off" spellcheck="false" aria-label="Find or make a category">
  <div id="cat-pills" class="cat-pills" role="listbox" aria-label="Categories"></div>
  <p id="cat-note" class="cat-note"></p>
 </section>
 <main id="editor" class="editor nf-live"></main>
 <p id="error" class="error" role="alert" hidden></p>
 <footer class="actions">
  <button id="import" type="button" class="icon" aria-label="Add a file" title="Add a file: PDF, picture, sound, video and more">
   <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21.4 11.1-8.5 8.5a5.5 5.5 0 0 1-7.8-7.8l8.5-8.5a3.7 3.7 0 0 1 5.2 5.2l-8.5 8.5a1.8 1.8 0 0 1-2.6-2.6l7.8-7.8"/></svg>
  </button>
  <button id="record" type="button" class="icon" aria-label="Record a voice note" title="Record a voice note">
   <svg class="mic" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"/></svg>
   <span class="rec-dot" aria-hidden="true"></span><span id="rec-time" class="rec-time"></span>
  </button>
  <input id="file" type="file" multiple hidden>
  <span id="hint-manual" class="hint"><kbd>Tab</kbd> categories · <kbd>Ctrl</kbd> <kbd>Enter</kbd> save</span>
  <span id="hint-auto" class="hint" hidden><kbd>Tab</kbd> categories · <kbd>Ctrl</kbd> <kbd>Enter</kbd> finish · <kbd>Esc</kbd> hide</span>
  <button id="preview" type="button" class="ghost" aria-pressed="true" title="Live preview (Alt+P)">Preview</button>
  <button id="cancel" type="button">Cancel</button>
  <button id="save" type="button" class="mod-cta" disabled>Save</button>
 </footer>
</div>
